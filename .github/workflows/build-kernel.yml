
name: Galaxy A21s - KernelSU Next

on:
  workflow_dispatch:

jobs:
  compilar-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Baixar codigo do kernel
        uses: actions/checkout@v4

      - name: Instalar dependencias
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential bc bison flex \
            libssl-dev libelf-dev libncurses-dev \
            python3 clang lld llvm \
            gcc-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi \
            device-tree-compiler

      - name: Integrar KernelSU Next Legacy
        run: |
          curl -fLSs \
            https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh \
            -o /tmp/kernelsu-setup.sh
          bash /tmp/kernelsu-setup.sh legacy

      - name: Configurar kernel
        run: |
          make O=out ARCH=arm64 \
            exynos850-a21snsxx_defconfig
          test -f out/.config

      - name: Verificar KernelSU Next
        run: |
          echo "Procurando driver KernelSU..."
          test -d KernelSU

          echo "Verificando configuracao..."
          grep -E '^CONFIG_KSU=y$|^CONFIG_KSU_NEXT=y$' \
            out/.config

          echo "KernelSU habilitado!"

      - name: Compilar kernel
        run: |
          make -j2 O=out ARCH=arm64 \
            LLVM=1 LLVM_IAS=1 \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_COMPAT=arm-linux-gnueabi- \
            Image.gz dtbs

      - name: Verificar resultado
        run: |
          test -f out/arch/arm64/boot/Image.gz
          echo "Kernel compilado!"

      - name: Salvar resultado
        uses: actions/upload-artifact@v4
        with:
          name: a21s-kernelsu-next-teste
          path: |
            out/arch/arm64/boot/Image.gz
            out/arch/arm64/boot/dts/**/*.dtb
          if-no-files-found: error
